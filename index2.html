<!DOCTYPE html>
<html>
<head>
    <title>Student Entry Form</title>
    <style>
        body {
            background-color: #eaf3f9;
            font-family: "Times New Roman", Times, serif;
        }

        fieldset {
            width: 350px;
            margin: 20px auto;
            border: 2px solid #333;
            padding: 15px;
        }

        legend {
            font-size: 20px;
            font-weight: bold;
        }

        table {
            margin: auto;
        }

        td {
            padding: 4px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 130px;
            padding: 3px;
        }

        textarea {
            height: 50px;
        }

        .buttons {
            text-align: center;
            padding-top: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 3px 10px;
            margin: 3px;
        }
    </style>
</head>

<body>
    <form>
        <fieldset>
            <legend>Student Entry Form</legend>
            <table>
                <tr>
                    <td><label for="studentid">Student ID</label></td>
                    <td><input type="text" id="studentid" name="studentid" placeholder="Enter Student ID"></td>
                </tr>
                <tr>
                    <td><label for="name">Student Name</label></td>
                    <td><input type="text" id="name" name="name" placeholder="Enter Your Name"></td>
                </tr>
                <tr>
                    <td><label for="father">Father's Name</label></td>
                    <td><input type="text" id="father" name="father" placeholder="Enter Father's Name"></td>
                </tr>
                <tr>
                    <td><label for="mother">Mother's Name</label></td>
                    <td><input type="text" id="mother" name="mother" placeholder="Enter Mother's Name"></td>
                </tr>
                <tr>
                    <td><label for="dob">Date Of Birth</label></td>
                    <td><input type="date" id="dob" name="dob"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                        <input type="radio" id="other" name="gender" value="Other">
                        <label for="other">Other</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="mobile">Mobile No.</label></td>
                    <td><input type="tel" id="mobile" name="mobile"></td>
                </tr>
                <tr>
                    <td><label for="email">Email ID</label></td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td><input type="password" id="password" name="password"></td>
                </tr>
                <tr>
                    <td><label for="address">Address</label></td>
                    <td><textarea id="address" name="address"></textarea></td>
                </tr>
                <tr>
                    <td><label for="department">Department</label></td>
                    <td>
                        <select id="department" name="department">
                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>ME</option>
                            <option>CE</option>
                            <option>EE</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="course">Course</label></td>
                    <td>
                        <select id="course" name="course">
                            <option>B.Tech</option>
                            <option>M.Tech</option>
                            <option>MCA</option>
                            <option>BCA</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="semester">Semester</label></td>
                    <td>
                        <select id="semester" name="semester">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Hobbies</td>
                    <td>
                        <input type="checkbox" id="reading" name="hobby" value="Reading">
                        <label for="reading">Reading</label>
                        <input type="checkbox" id="sports" name="hobby" value="Sports">
                        <label for="sports">Sports</label>
                        <input type="checkbox" id="music" name="hobby" value="Music">
                        <label for="music">Music</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="photo">Upload Photo</label></td>
                    <td><input type="file" id="photo" name="photo"></td>
                </tr>
                <tr>
                    <td colspan="2" class="buttons">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>

</html>
