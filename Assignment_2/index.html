<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <img src="https://t3.ftcdn.net/jpg/04/91/24/24/360_F_491242470_WdSpwKRMYiHqTvRBRpsH72cM4g1VWL22.jpg">
            <h1>BUS BOOKING SYSTEM</h1>
        </div>

        <div class="box">
            <h2>User Information</h2>
            <div class="form-row">
                <label>User Name :</label>
                <input type="text" id="name" placeholder="Enter your Name">
            </div>

            <div class="form-row">
                <label>User Age :</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="form-row">
                <label>Aadhar Number :</label>
                <input type="text" id="aadhar" placeholder="Enter 12 digit Aadhar" maxlength="12" inputmode="numeric">
            </div>

            <div class="form-row">
                <label>Select Your City :</label>

                <select id="city">
                    <option value="">Select City -</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Kolkata">Kolkata</option>
                    <option value="Jaipur">Jaipur</option>
                </select>
            </div>

            <div class="form-row">
                <label>Journey Date :</label>
                <input type="date" id="date">
            </div>

        </div>

        <div class="box">
            <h2>Bus Information</h2>
            <div class="bus-info">
                <div class="bus-type">
                    <label>
                        <input type="radio" name="bus" value="AC Bus" data-price="2000">
                        AC Bus - 2000
                    </label>

                    <label>
                        <input type="radio" name="bus" value="Non AC Bus" data-price="1500">
                        Non AC Bus - 1500
                    </label>

                </div>

                <div class="seat">

                    <label><strong>Select Your Seat</strong></label>

                    <select id="seat">
                        <option value="">Select Seat -</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>

                </div>

            </div>

        </div>
        <div class="button-box">

            <button class="buy-btn" onclick="bookTicket()">
                BUY NOW
            </button>

        </div>

        <div id="ticket">


            <div class="ticket-header">

                <h2>
                    BUS TICKET
                </h2>

                <p>
                    Ticket Booking Successfully!
                </p>

            </div>



            <div class="ticket-details">


                <div class="ticket-row">

                    <strong>
                        Passenger Name:
                    </strong>

                    <span id="showName"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        Passenger Age:
                    </strong>

                    <span id="showAge"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        Aadhar Number:
                    </strong>

                    <span id="showAadhar"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        City:
                    </strong>

                    <span id="showCity"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        Journey Date:
                    </strong>

                    <span id="showDate"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        Bus Type:
                    </strong>

                    <span id="showBus"></span>

                </div>


                <div class="ticket-row">

                    <strong>
                        Seat Number:
                    </strong>

                    <span id="showSeat"></span>

                </div>
                <div class="ticket-row price">
                    <strong>
                        Ticket Price:
                    </strong>
                    <span>
                        <span id="showPrice"></span>
                    </span>
                </div>
            </div>
            <div class="ticket-footer">
                Thank you for booking with us
            </div>
        </div>
    </div>

    <script>

        function bookTicket() {

            let name = document.getElementById("name").value.trim();
            let age = document.getElementById("age").value;
            let aadhar = document.getElementById("aadhar").value;
            let city = document.getElementById("city").value;
            let date = document.getElementById("date").value;
            let seat = document.getElementById("seat").value;

            let bus = document.querySelector(
                'input[name="bus"]:checked'
            );

            if (name === "") {
                alert("Please enter your name.");
                return;
            }

            if (age === "" || age < 1) {
                alert("Please enter a valid age.");
                return;
            }

            if (!/^\d{12}$/.test(aadhar)) {
                alert("Aadhar number must contain exactly 12 digits.");
                return;
            }

            if (city === "") {
                alert("Please select your city.");
                return;
            }

            if (date === "") {
                alert("Please select journey date.");
                return;
            }

            if (!bus) {
                alert("Please select AC or Non-AC bus.");
                return;
            }

            if (seat === "") {
                alert("Please select your seat.");
                return;
            }
            let busName =
                bus.value;


            let price =
                bus.getAttribute("data-price"); 

            document
                .getElementById("showName")
                .textContent = name;


            document
                .getElementById("showAge")
                .textContent = age;


            document
                .getElementById("showAadhar")
                .textContent = aadhar;


            document
                .getElementById("showCity")
                .textContent = city;


            document
                .getElementById("showDate")
                .textContent = date;
            document
                .getElementById("showBus")
                .textContent = busName;
            document
                .getElementById("showSeat")
                .textContent = seat;
            document
                .getElementById("showPrice")
                .textContent = price;
            document
                .getElementById("ticket")
                .style.display = "block";
            document
                .getElementById("ticket")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


    </script>

</body>

</html>
