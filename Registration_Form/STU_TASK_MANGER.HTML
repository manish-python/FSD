<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Task Manager</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter Your Task">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="stats-section">
            <div class="stat-box">
                <span class="stat-title">Total Task</span>
                <span id="totalTasks" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Completed Task</span>
                <span id="completedTasks" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Pending Task</span>
                <span id="pendingTasks" class="stat-value">0</span>
            </div>
        </div>

            <div class="filters-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
