<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: auto;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin-top: 15px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 60px;
        }

        .show-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }

        .strength {
            height: 5px;
            width: 100%;
            background: #ddd;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            font-size: 13px;
            color: #666;
        }

        .terms input {
            width: auto;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .login a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .container {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">R</div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Join us today and create your account
        </p>

        <form id="registerForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                >
            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                    >

                    <button
                        type="button"
                        class="show-btn"
                        onclick="showPassword()"
                        id="showBtn">
                        Show
                    </button>

                </div>

                <div class="strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

            </div>

            <div class="terms">

                <input type="checkbox" id="terms">

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </span>

            </div>

            <button class="register-btn" type="submit">
                Create Account
            </button>

            <p id="message"></p>

        </form>

        <div class="login">
            Already have an account?
            <a href="#">Login</a>
        </div>

    </div>


    <script>

        // Show / Hide Password
        function showPassword() {

            let password = document.getElementById("password");
            let button = document.getElementById("showBtn");

            if (password.type === "password") {

                password.type = "text";
                button.innerText = "Hide";

            } else {

                password.type = "password";
                button.innerText = "Show";

            }
        }


        // Password Strength
        document.getElementById("password").addEventListener("input", function () {

            let password = this.value;
            let bar = document.getElementById("strengthBar");

            let strength = 0;

            if (password.length >= 6)
                strength++;

            if (password.match(/[A-Z]/))
                strength++;

            if (password.match(/[0-9]/))
                strength++;

            if (password.match(/[!@#$%^&*]/))
                strength++;


            if (strength === 0) {

                bar.style.width = "0%";

            } else if (strength === 1) {

                bar.style.width = "25%";
                bar.style.background = "red";

            } else if (strength === 2) {

                bar.style.width = "50%";
                bar.style.background = "orange";

            } else if (strength === 3) {

                bar.style.width = "75%";
                bar.style.background = "gold";

            } else {

                bar.style.width = "100%";
                bar.style.background = "green";

            }

        });


        // Form Validation
        document.getElementById("registerForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let terms = document.getElementById("terms").checked;

            let message = document.getElementById("message");


            if (name === "") {

                message.innerText = "Please enter your name";
                message.style.color = "red";
                return;

            }


            if (email === "") {

                message.innerText = "Please enter your email";
                message.style.color = "red";
                return;

            }


            if (password.length < 6) {

                message.innerText =
                    "Password must contain at least 6 characters";

                message.style.color = "red";
                return;

            }


            if (password !== confirmPassword) {

                message.innerText =
                    "Passwords do not match";

                message.style.color = "red";
                return;

            }


            if (!terms) {

                message.innerText =
                    "Please accept the Terms & Conditions";

                message.style.color = "red";
                return;

            }


            message.innerText =
                "✓ Account created successfully!";

            message.style.color = "green";


            document.getElementById("registerForm").reset();

            document.getElementById("strengthBar").style.width = "0%";

        });

    </script>

</body>
</html>
