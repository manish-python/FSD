<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e8f5e9;
            color: green;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Student Registration</h2>

        <form id="studentForm">

            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label>Roll Number</label>
            <input type="text" id="roll" placeholder="Enter roll number">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">

            <label>Maths Marks</label>
            <input type="number" id="maths" placeholder="Enter marks">

            <label>Physics Marks</label>
            <input type="number" id="physics" placeholder="Enter marks">

            <label>Chemistry Marks</label>
            <input type="number" id="chemistry" placeholder="Enter marks">

            <button type="submit">Register Student</button>

        </form>

        <div id="result"></div>

    </div>


    <script>

        document.getElementById("studentForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let email = document.getElementById("email").value;

            let maths = Number(document.getElementById("maths").value);
            let physics = Number(document.getElementById("physics").value);
            let chemistry = Number(document.getElementById("chemistry").value);

            if (name === "" || roll === "" || email === "") {
                alert("Please fill all student details");
                return;
            }

            if (maths < 0 || maths > 100 ||
                physics < 0 || physics > 100 ||
                chemistry < 0 || chemistry > 100) {

                alert("Marks must be between 0 and 100");
                return;
            }

            let total = maths + physics + chemistry;
            let percentage = total / 3;

            let result = document.getElementById("result");

            result.innerHTML = `
                <h3>Registration Successful!</h3>
                <p><b>Name:</b> ${name}</p>
                <p><b>Roll Number:</b> ${roll}</p>
                <p><b>Email:</b> ${email}</p>
                <p><b>Total Marks:</b> ${total}/300</p>
                <p><b>Percentage:</b> ${percentage.toFixed(2)}%</p>
            `;

        });

    </script>

</body>
</html>
