<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
</head>
<style>
    img{
        width: 100px;
        height: 100px;
    }
    table{
        width: 80%;
        margin: auto;
        padding: 10px;
        font-size: 25px;
        color: red;
        border: 2px solid red;

    }
</style>
<body>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="https://dummyjson.com/products";
        async function loadData() {
            try{
                const res=await fetch(URL);
                const data=await res.json();
                console.log("Data",data.products);
                let row=""
                data.products.map((i,index)=>{
                    row+=``;
                    <tr>
                        <td>$(index+1)</td>
                        <td>$(i.title)</td>
                        <td><img src="${i.images}" alt="Product Image"></td>
                        <td>$(i.category)</td>
                        <td>$(i.price)</td>
                    </tr>
                })
                ele.innerHTML=row;
            }
            catch(){

            }
        }
    </script>
</body>
</html>
